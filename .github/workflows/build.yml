name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Install dependencies
        run: npm install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Find APK
        run: find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: digital-khatta.apk
          path: "**/*.apk"

      - name: Tag this working build
        run: |
          DATE=$(date +'%Y-%m-%d-%H%M')
          TAG="working-build-${DATE}"
          git config user.email "build@digitalkhatta.app"
          git config user.name "Build Bot"
          git tag "$TAG"
          git push origin "$TAG"
          echo "✅ Tagged as: $TAG"
